# Base file: service definitions common to every environment. Always used
# together with an overlay — this file alone defines no ports and no
# build target, so `docker compose -f docker-compose.yml up` on its own
# won't do anything useful. See docker-compose.dev.yml / .prod.yml.

services:
  db:
    image: postgres:16.6-alpine
    container_name: celluloid-db
    environment:
      # No fallback default for any of these three — a weak, checked-in
      # default password is exactly what infra/env/.env is meant to avoid.
      # `:?` makes compose fail immediately with a clear message instead
      # of silently starting Postgres with an empty or guessable password.
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in infra/env/.env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in infra/env/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/env/.env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  cache:
    image: redis:7.4-alpine
    container_name: celluloid-cache
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-08T15-41-24Z
    container_name: celluloid-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in infra/env/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in infra/env/.env}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    container_name: celluloid-backend
    build:
      context: ../../apps/backend
    env_file:
      - ../env/.env
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    container_name: celluloid-web
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    depends_on:
      - backend

volumes:
  db_data:
  minio_data:

networks:
  default:
    name: celluloid-network
