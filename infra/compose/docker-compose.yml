services:
  db:
    image: postgres:16-alpine
    container_name: celluloid-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-celluloid}
      POSTGRES_USER: ${POSTGRES_USER:-celluloid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-celluloid}
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data

  cache:
    image: redis:7-alpine
    container_name: celluloid-cache
    restart: unless-stopped
    ports:
      - '6379:6379'

  minio:
    image: quay.io/minio/minio:latest
    container_name: celluloid-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-celluloid}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-celluloid123}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data

  backend:
    container_name: celluloid-backend
    build:
      context: ../../apps/backend
    env_file:
      - ../env/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://${POSTGRES_USER:-celluloid}:${POSTGRES_PASSWORD:-celluloid}@db:5432/${POSTGRES_DB:-celluloid}
      CELERY_BROKER_URL: redis://cache:6379/0
    volumes:
      - ../../apps/backend:/app
    ports:
      - '8000:8000'
    depends_on:
      - db
      - cache
      - minio

  web:
    container_name: celluloid-web
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    volumes:
      - ../../apps/web:/repo/apps/web
    ports:
      - '3000:3000'
    depends_on:
      - backend
      - db

volumes:
  db_data:
  minio_data:

networks:
  default:
    name: celluloid-network
